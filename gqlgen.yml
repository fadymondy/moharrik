schema:
  - internal/graph/schema/*.graphqls

exec:
  filename: internal/graph/gen/generated.go
  package: gen

model:
  filename: internal/graph/gen/models_gen.go
  package: gen

# togo owns the resolvers (generated per-resource, sqlc-backed) — gqlgen only
# generates the executable schema + input models. GraphQL types autobind to the
# sqlc models in internal/db/gen.
autobind:
  - "github.com/fadymondy/moharrik/internal/db/gen"

models:
  Time:
    model: github.com/99designs/gqlgen/graphql.Time
  # MH-591: internal/db/gen (sqlc) already exports stale Contact and
  # ContactIdentity structs; without these overrides autobind would silently
  # wire the GraphQL types to them instead of the hand-written model package.
  Contact:
    model: github.com/fadymondy/moharrik/internal/graph/model.Contact
  ContactIdentity:
    model: github.com/fadymondy/moharrik/internal/graph/model.ContactIdentity
  ContactMetaEntry:
    model: github.com/fadymondy/moharrik/internal/graph/model.ContactMetaEntry
