# Moharrik in production on a single container host behind a reverse proxy (an alternative to
# docker-compose.selfhost.yml when Postgres runs elsewhere). The image is built once and loaded
# with `docker load` (no registry needed). The proxy forwards the public host -> <host>:3120 (the
# web; it proxies /api and /graphql to the API inside the same container). DATABASE_URL and
# APP_DATABASE_URL in .env.prod point at your Postgres.
#
#   migrate:  docker compose run --rm moharrik /app/bin/moharrik-migrate
#   admin:    docker compose exec moharrik /app/bin/moharrik-admin …
#
# Secrets live only in .env.prod next to this file on the server (never in git).
name: moharrik-prod
services:
  moharrik:
    image: moharrik:latest
    container_name: moharrik
    env_file: .env.prod
    environment:
      PORT: "3120"
      # The API binds all interfaces INSIDE the container so the port below can
      # be published. Publish it on a private address only (MOHARRIK_WS_BIND),
      # so it is reachable from the reverse proxy and from nowhere else.
      ADDR: "0.0.0.0:8120"
    ports:
      - "0.0.0.0:3120:3120"
      # The browser socket (MH-61) cannot go through the web app: /api/* is a
      # Next rewrite, and a Next rewrite cannot carry a protocol upgrade — it
      # answers 500. The proxy routes the single path /api/agents/ws straight here.
      # Everything else still goes through :3120.
      - "${MOHARRIK_WS_BIND:-127.0.0.1}:8121:8120"
    volumes:
      # Uploads, mail (.eml) and logs survive a redeploy (force-recreate).
      - moharrik-storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3120/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  moharrik-storage:
