name: Feature request
description: Suggest an idea or improvement for Moharrik.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Big or open-ended ideas are often better started in [Discussions → Ideas](https://github.com/fadymondy/moharrik/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation and why the current behaviour falls short.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - Inbox and channels
        - WhatsApp
        - CRM and leads
        - Email marketing
        - Automation and browser extension
        - Research, trends and notifications
        - MCP and AI connectors
        - Workspaces, auth and permissions
        - Web app
        - Self-hosting
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this.
