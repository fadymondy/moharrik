name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moharrik_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Codegen (sqlc + gqlgen)
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          go run github.com/99designs/gqlgen generate
      - name: OpenAPI export (integration gate — compiles everything)
        run: go run ./cmd/api openapi > /dev/null
      - name: Vet
        run: go vet ./...
      - name: Unit tests + guards (MCP scopes, sqlc tenant predicate, authz) — database suites included
        # Every database-backed suite skips itself when these are unset, so without them this
        # step reported green while running a fraction of the tests. The generated internal/rest
        # suites also need APP_DATABASE_URL (the RLS pool) and DB_DRIVER.
        env:
          DB_DRIVER: pgx
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/moharrik_test?sslmode=disable
          TEST_APP_DATABASE_URL: postgres://moharrik_app_test:test@localhost:5432/moharrik_test?sslmode=disable
          APP_DATABASE_URL: postgres://moharrik_app_test:test@localhost:5432/moharrik_test?sslmode=disable
        run: |
          status=0
          go test -count=1 -v ./... > go-test.log 2>&1 || status=$?
          grep -E '^(ok|FAIL|--- FAIL|--- SKIP)' go-test.log || true
          if [ "$status" -ne 0 ]; then tail -60 go-test.log; exit "$status"; fi
          # A skipped database suite is not a passing one. Only the manual live-TEI proof may skip.
          if grep -E -- '--- SKIP' go-test.log | grep -v 'TestLiveTEI'; then
            echo "::error::a test skipped in CI — it needs a database or config the step does not give it"
            exit 1
          fi
      - name: Cross-workspace isolation sweep
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/moharrik_test?sslmode=disable
          TEST_APP_DATABASE_URL: postgres://moharrik_app_test:test@localhost:5432/moharrik_test?sslmode=disable
        run: go test -count=1 ./internal/server/ -run Isolation -v

  extension:
    # The driver replays every step the recorder emits (MH-398), against jsdom.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      # grid:check needs the fadymondy.com-v2 checkout (packages/sync-grid.mjs); run it locally
      # with `make grid-check` until the grid is published as a package.
